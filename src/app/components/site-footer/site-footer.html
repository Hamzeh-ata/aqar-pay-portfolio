<footer class="border-t border-line bg-white py-12 md:py-14">
  <div class="container-wide" appReveal>
    <div class="flex flex-col gap-10 md:flex-row md:items-start md:justify-between">
      <div>
        <div class="flex items-center gap-2.5 font-extrabold tracking-[0.08em] text-ink">
          <span class="grid h-8 w-8 place-items-center rounded-lg bg-ink text-[0.7rem] font-extrabold text-white">AP</span>
          <span>AQARPAY</span>
        </div>
        <p class="mt-3 max-w-xs text-sm text-copy">{{ 'footer.tagline' | translate }}</p>
        <a href="tel:+962798354093" class="mt-4 inline-flex text-sm font-semibold text-ink">
          +962 79 835 4093
        </a>
      </div>

      <nav class="flex flex-wrap gap-x-8 gap-y-3">
        @for (link of footerLinks; track link.href) {
          <a [href]="link.href" class="text-sm font-semibold text-copy transition hover:text-ink">
            {{ link.labelKey | translate }}
          </a>
        }
      </nav>

      <div class="flex items-center gap-1 rounded-full border border-line px-1 py-1 text-[0.78rem] font-bold">
        <button
          type="button"
          class="rounded-full px-2.5 py-1"
          [class.bg-ink]="currentLang() === 'en'"
          [class.text-white]="currentLang() === 'en'"
          [class.text-muted]="currentLang() !== 'en'"
          (click)="setLanguage('en')"
        >
          EN
        </button>
        <button
          type="button"
          class="rounded-full px-2.5 py-1"
          [class.bg-ink]="currentLang() === 'ar'"
          [class.text-white]="currentLang() === 'ar'"
          [class.text-muted]="currentLang() !== 'ar'"
          (click)="setLanguage('ar')"
        >
          AR
        </button>
      </div>
    </div>

    <div class="mt-10 border-t border-line pt-6 text-center text-[0.78rem] text-muted md:text-start">
      {{ 'footer.rights' | translate }}
    </div>
  </div>
</footer>
