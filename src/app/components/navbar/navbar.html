<header class="fixed inset-x-0 top-0 z-50 px-4 pt-4">
  <div
    class="container-wide flex items-center justify-between gap-4 rounded-full px-4 py-2.5 transition-all duration-300 md:px-5"
    [class.nav-floating]="scrolled() || menuOpen()"
    [class.bg-transparent]="!scrolled() && !menuOpen()"
  >
    <a href="#top" class="flex items-center gap-2.5 font-extrabold tracking-[0.08em] text-ink">
      <span class="grid h-8 w-8 place-items-center rounded-lg bg-ink text-[0.7rem] font-extrabold text-white">AP</span>
      <span>AQARPAY</span>
    </a>

    <nav class="hidden items-center gap-1 lg:flex">
      @for (link of navLinks; track link.href) {
        <a
          [href]="link.href"
          class="rounded-full px-3 py-2 text-[0.84rem] font-semibold text-copy transition hover:text-ink"
        >
          {{ link.labelKey | translate }}
        </a>
      }
    </nav>

    <div class="hidden items-center gap-3 lg:flex">
      <div class="flex items-center gap-1 rounded-full border border-line px-1 py-1 text-[0.78rem] font-bold">
        <button
          type="button"
          class="rounded-full px-2.5 py-1"
          [class.bg-ink]="currentLang() === 'en'"
          [class.text-white]="currentLang() === 'en'"
          [class.text-muted]="currentLang() !== 'en'"
          (click)="setLanguage('en')"
        >
          EN
        </button>
        <button
          type="button"
          class="rounded-full px-2.5 py-1"
          [class.bg-ink]="currentLang() === 'ar'"
          [class.text-white]="currentLang() === 'ar'"
          [class.text-muted]="currentLang() !== 'ar'"
          (click)="setLanguage('ar')"
        >
          AR
        </button>
      </div>
      <a href="#demo" class="btn-primary !min-h-10 !px-4 !text-[0.84rem]">{{ 'nav.bookDemo' | translate }}</a>
    </div>

    <button
      type="button"
      class="grid h-10 w-10 place-items-center rounded-full border border-line bg-white/80 lg:hidden"
      (click)="toggleMenu()"
      [attr.aria-label]="(menuOpen() ? 'nav.closeMenu' : 'nav.openMenu') | translate"
    >
      <span class="flex w-4 flex-col gap-1">
        <span class="h-px w-full bg-ink"></span>
        <span class="h-px w-full bg-ink"></span>
        <span class="h-px w-full bg-ink"></span>
      </span>
    </button>
  </div>

  @if (menuOpen()) {
    <div class="container-wide mt-2 rounded-3xl border border-line bg-white/95 p-4 shadow-xl backdrop-blur lg:hidden">
      <div class="flex flex-col gap-1">
        @for (link of navLinks; track link.href) {
          <a
            [href]="link.href"
            class="rounded-2xl px-3 py-3 text-sm font-semibold text-ink"
            (click)="closeMenu()"
          >
            {{ link.labelKey | translate }}
          </a>
        }
      </div>
      <div class="mt-3 flex items-center justify-between gap-3 border-t border-line pt-3">
        <div class="flex items-center gap-1 rounded-full border border-line px-1 py-1 text-[0.78rem] font-bold">
          <button type="button" class="rounded-full px-2.5 py-1" (click)="setLanguage('en')">EN</button>
          <button type="button" class="rounded-full px-2.5 py-1" (click)="setLanguage('ar')">AR</button>
        </div>
        <a href="#demo" class="btn-primary !min-h-10 !px-4 !text-[0.84rem]" (click)="closeMenu()">
          {{ 'nav.bookDemo' | translate }}
        </a>
      </div>
    </div>
  }
</header>
